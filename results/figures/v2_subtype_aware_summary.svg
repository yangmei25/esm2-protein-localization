<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">V2 subtype-aware ESM-2 150M performance summary</title>
  <desc id="desc">Three panels compare legacy binary metrics, external subtype F1 scores, and peripheral recall before and after subtype-aware fine-tuning.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#172033}.sub{font:15px Arial,sans-serif;fill:#5b6472}
    .panel{fill:#f8fafc;stroke:#d9e1ea;stroke-width:1.5}.pt{font:700 18px Arial,sans-serif;fill:#172033}
    .lab{font:14px Arial,sans-serif;fill:#303846}.val{font:700 13px Arial,sans-serif;fill:#172033}
    .tick{font:12px Arial,sans-serif;fill:#697386}.grid{stroke:#dfe5ec;stroke-width:1}.old{fill:#9aa6b2}.new{fill:#2878b5}
    .accent{fill:#e76f51}.note{font:13px Arial,sans-serif;fill:#5b6472}.gain{font:700 19px Arial,sans-serif;fill:#16845b}
  </style>
  <text x="50" y="45" class="title">Subtype-aware ESM-2 150M — seed 42</text>
  <text x="50" y="70" class="sub">Selected at epoch 3 by internal validation macro-F1; external results are post-hoc.</text>

  <rect x="40" y="95" width="355" height="470" rx="12" class="panel"/>
  <text x="62" y="128" class="pt">A. Legacy binary compatibility</text>
  <text x="62" y="151" class="note">Original validation set, n = 1,264</text>
  <line x1="135" y1="185" x2="135" y2="500" class="grid"/><line x1="255" y1="185" x2="255" y2="500" class="grid"/><line x1="375" y1="185" x2="375" y2="500" class="grid"/>
  <text x="128" y="520" class="tick">0.90</text><text x="248" y="520" class="tick">0.94</text><text x="368" y="520" class="tick">0.98</text>
  <text x="62" y="208" class="lab">Accuracy</text><rect x="135" y="190" width="144" height="14" rx="3" class="old"/><rect x="135" y="210" width="110" height="14" rx="3" class="new"/><text x="286" y="202" class="val">.9480</text><text x="252" y="222" class="val">.9367</text>
  <text x="62" y="278" class="lab">Precision</text><rect x="135" y="260" width="162" height="14" rx="3" class="old"/><rect x="135" y="280" width="52" height="14" rx="3" class="new"/><text x="304" y="272" class="val">.9539</text><text x="194" y="292" class="val">.9174</text>
  <text x="62" y="348" class="lab">Recall</text><rect x="135" y="330" width="58" height="14" rx="3" class="old"/><rect x="135" y="350" width="94" height="14" rx="3" class="new"/><text x="200" y="342" class="val">.9194</text><text x="236" y="362" class="val">.9314</text>
  <text x="62" y="418" class="lab">F1</text><rect x="135" y="400" width="109" height="14" rx="3" class="old"/><rect x="135" y="420" width="73" height="14" rx="3" class="new"/><text x="251" y="412" class="val">.9363</text><text x="215" y="432" class="val">.9244</text>
  <text x="62" y="488" class="lab">ROC-AUC</text><rect x="135" y="470" width="246" height="14" rx="3" class="old"/><rect x="135" y="490" width="234" height="14" rx="3" class="new"/><text x="318" y="482" class="val">.9819</text><text x="306" y="502" class="val">.9781</text>
  <rect x="62" y="540" width="12" height="12" class="old"/><text x="80" y="551" class="tick">Previous binary, 3-seed mean</text><rect x="245" y="540" width="12" height="12" class="new"/><text x="263" y="551" class="tick">New multi-label</text>

  <rect x="420" y="95" width="355" height="470" rx="12" class="panel"/>
  <text x="442" y="128" class="pt">B. External subtype F1</text>
  <text x="442" y="151" class="note">Homology-filtered post-hoc cohort, n = 2,284</text>
  <line x1="535" y1="185" x2="535" y2="505" class="grid"/><line x1="635" y1="185" x2="635" y2="505" class="grid"/><line x1="735" y1="185" x2="735" y2="505" class="grid"/>
  <text x="529" y="525" class="tick">0.0</text><text x="629" y="525" class="tick">0.5</text><text x="729" y="525" class="tick">1.0</text>
  <text x="442" y="230" class="lab">Soluble</text><rect x="535" y="210" width="187" height="28" rx="4" class="new"/><text x="728" y="229" class="val">.934</text>
  <text x="442" y="305" class="lab">Transmembrane</text><rect x="535" y="285" width="189" height="28" rx="4" class="new"/><text x="730" y="304" class="val">.945</text>
  <text x="442" y="380" class="lab">Peripheral</text><rect x="535" y="360" width="103" height="28" rx="4" class="accent"/><text x="644" y="379" class="val">.516</text>
  <text x="442" y="455" class="lab">Lipid anchor</text><rect x="535" y="435" width="131" height="28" rx="4" class="new"/><text x="672" y="454" class="val">.657</text>
  <text x="442" y="548" class="note">External macro-F1 .763 · micro-F1 .885</text>

  <rect x="800" y="95" width="360" height="470" rx="12" class="panel"/>
  <text x="822" y="128" class="pt">C. Peripheral recall</text>
  <text x="822" y="151" class="note">The weakness that motivated subtype training</text>
  <line x1="855" y1="485" x2="1125" y2="485" stroke="#9da8b5" stroke-width="1.5"/>
  <rect x="890" y="322" width="75" height="163" rx="5" class="old"/><rect x="1020" y="210" width="75" height="275" rx="5" class="accent"/>
  <text x="900" y="310" class="val">0.3254</text><text x="1030" y="198" class="val">0.5494</text>
  <text x="876" y="510" class="lab">Previous binary</text><text x="1016" y="510" class="lab">Subtype-aware</text>
  <text x="930" y="555" class="gain">+0.2240</text>
  <text x="884" y="580" class="note">+22.4 percentage points</text>
</svg>
